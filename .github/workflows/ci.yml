name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read # read @thepia/* from GitHub Packages (org repo: GITHUB_TOKEN suffices)

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@thepia'
          cache: pnpm

      - name: Install
        # Frozen first for authority; fall back to a fresh resolution if the
        # committed lockfile is stale (this repo is normally built inside the
        # Thepia pnpm workspace, so its standalone lockfile can drift).
        run: pnpm install --frozen-lockfile || pnpm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint (biome)
        run: pnpm check

      - name: Typecheck (astro)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  # Browser e2e (Playwright) is intentionally NOT run here: it needs a running
  # SSL server + browsers and belongs in a separate, heavier job. Integration
  # tests hit real services and are excluded from the PR gate too.
