name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read # read @thepia/* from GitHub Packages (org repo: GITHUB_TOKEN suffices)

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 11.11.0 matches branding's green CI; 11.5.0 makes ERR_PNPM_IGNORED_BUILDS
        # fatal for standalone installs (un-approved biome/oxide build scripts),
        # while 11.11.0 treats it as a warning and proceeds.
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@thepia'
          cache: pnpm

      - name: Install
        # The committed lockfile is a STANDALONE resolution (regenerated with
        # `pnpm install --ignore-workspace`), since CI clones this repo alone,
        # outside the Thepia pnpm workspace. Keep it in sync that way.
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # org repo: ephemeral token can read @thepia/*

      - name: Lint (biome)
        run: pnpm check

      - name: Typecheck (astro)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  # Browser e2e (Playwright) is intentionally NOT run here: it needs a running
  # SSL server + browsers and belongs in a separate, heavier job. Integration
  # tests hit real services and are excluded from the PR gate too.
