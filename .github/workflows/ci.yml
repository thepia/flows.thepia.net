name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read # read @thepia/* from GitHub Packages (org repo: GITHUB_TOKEN suffices)

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0 # match packageManager (avoids ERR_PNPM_BAD_PM_VERSION)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@thepia'
          cache: pnpm

      # pnpm 11 requires an explicit build-script allowlist (`allowBuilds`, a
      # name->bool map; it replaced onlyBuiltDependencies in v11). That lives in
      # pnpm-workspace.yaml, which only exists at the Thepia workspace ROOT. CI
      # clones this member ALONE, so generate the equivalent here. NOT committed:
      # a pnpm-workspace.yaml in this dir would make `pnpm dev` treat the repo as
      # its own workspace root and lose the live flows-auth link.
      - name: Approve native build scripts (standalone equivalent of the workspace allowBuilds)
        run: |
          printf "allowBuilds:\n  '@biomejs/biome': true\n  '@tailwindcss/oxide': true\n" > pnpm-workspace.yaml

      - name: Install
        # Committed lockfile is a STANDALONE resolution (pnpm install
        # --ignore-workspace), since CI clones this repo outside the workspace.
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # org repo: ephemeral token can read @thepia/*

      - name: Lint (biome)
        run: pnpm check

      - name: Typecheck (astro)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  # Browser e2e (Playwright) is intentionally NOT run here: it needs a running
  # SSL server + browsers and belongs in a separate, heavier job. Integration
  # tests hit real services and are excluded from the PR gate too.
